# Sampling configurations. Each top-level key is a sampling ID (an output directory level).
# max_area / vae_image_area "from_resolution" resolve to resolution[0] * resolution[1].
# resolution is the model inference size. When it differs from the dataset size (256x256), io_resample is
# required: the input is resized up (mask: nearest, stays binary), and the raw output is resized back to the
# dataset size before saving, so saved raw/composite PNGs and evaluation stay at the native size.
default:
  seed: 0
  generator_device: cpu
  resolution: [256, 256]
  per_variant:
    FLUX.1-Fill-dev: {num_inference_steps: 50, guidance_scale: 30.0, max_sequence_length: 512}
    FLUX.1-Kontext-dev: {num_inference_steps: 28, guidance_scale: 2.5, max_sequence_length: 512, max_area: from_resolution, _auto_resize: false}
    Qwen-Image-Inpaint: {num_inference_steps: 50, true_cfg_scale: 4.0, strength: 1.0, negative_prompt: " "}
    Qwen-Image-Edit-2509: {num_inference_steps: 40, true_cfg_scale: 4.0, guidance_scale: 1.0, negative_prompt: " ", vae_image_area: from_resolution, condition_area: 147456}
    FLUX.1-Kontext-dev-Mask: {num_inference_steps: 28, guidance_scale: 2.5, max_sequence_length: 512, max_area: from_resolution, _auto_resize: false, strength: 1.0}
    Qwen-Image-Edit-2509-Mask: {num_inference_steps: 40, true_cfg_scale: 4.0, guidance_scale: 1.0, negative_prompt: " ", vae_image_area: from_resolution, condition_area: 147456}
r512:
  seed: 0
  generator_device: cpu
  resolution: [512, 512]
  io_resample: {image_up: bicubic, mask_up: nearest, output_down: bicubic}
  per_variant:
    FLUX.1-Fill-dev: {num_inference_steps: 50, guidance_scale: 30.0, max_sequence_length: 512}
    FLUX.1-Kontext-dev: {num_inference_steps: 28, guidance_scale: 2.5, max_sequence_length: 512, max_area: from_resolution, _auto_resize: false}
    Qwen-Image-Inpaint: {num_inference_steps: 50, true_cfg_scale: 4.0, strength: 1.0, negative_prompt: " "}
    Qwen-Image-Edit-2509: {num_inference_steps: 40, true_cfg_scale: 4.0, guidance_scale: 1.0, negative_prompt: " ", vae_image_area: from_resolution, condition_area: 147456}
